name: Build APK & AAB

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GRADLE_VERSION: 9.3.1
  JDK_VERSION: 17

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -keyalias androiddebugkey -keypass android -storepass android -dname "C=US, ST=CA, L=Mountain View, O=Google, OU=Android, CN=Android Debug" -validity 365 -keyalg RSA -keysize 2048

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --stacktrace

      - name: Build Release AAB
        run: gradle bundleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aab-release
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/
          retention-days: 30
